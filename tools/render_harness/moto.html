<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/vendor/three.bundle.js","three/addons/loaders/GLTFLoader.js":"/vendor/three.bundle.js","three/addons/utils/SkeletonUtils.js":"/vendor/three.bundle.js"}}</script>
<style>body{margin:0;background:#555}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { initRetro } from '/src/retro.js';
import { makeCharacter } from '/src/character.js';
import { createVehicles } from '/src/vehicles.js';
await initRetro();
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x667788);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.6)); const dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(3,6,4); scene.add(dl);
const veh=await createVehicles(scene,{ground:()=>0,blocked:()=>false,collider:{resolve(){}}});
const player=makeCharacter({hat:'none',player:true}); if(new URLSearchParams(location.search).get('mode')!=='cop'&&false)scene.add(player);
const types=['motor','beat','mio']; const picked=types.map(t=>veh.list.find(v=>v.type===t));
const W=520,H=520, views=[[6,1.3,0],[0,1.3,6],[4.2,2.2,4.2]];
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); ren.setSize(W*3,H*3); document.body.appendChild(ren.domElement); ren.setScissorTest(true);
const cam=new THREE.PerspectiveCamera(32,1,0.1,50);
// semua motor parkir di 3 slot, dipindah ke origin satu per satu
picked.forEach((v,i)=>{ v.obj.visible=false; if(v.rider)v.rider.visible=false; });
const mode=new URLSearchParams(location.search).get('mode')||'player';
picked.forEach((v,i)=>{
  picked.forEach(u=>{u.obj.visible=false}); v.obj.visible=true; v.obj.position.set(0,0,0); v.obj.rotation.set(0,0,0);
  if(mode==='player'){ veh.enter(v,player); } else { if(mode==='cop'&&v.mkCopRider) v.mkCopRider(); v.rider.visible=true; if(mode==='pillion'&&v.pillion) v.pillion.visible=true; }
  views.forEach((vw,j)=>{ cam.position.set(...vw); cam.lookAt(0,0.9,0); ren.setViewport(j*W,(2-i)*H,W,H); ren.setScissor(j*W,(2-i)*H,W,H); ren.render(scene,cam); });
  if(mode==='player') veh.leave(player);
});
window.__done=true;
</script></body></html>
